<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sealShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b45309" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Outer serrated edge / seal points -->
  <circle cx="120" cy="120" r="112" fill="#fffbeb" stroke="#b45309" stroke-width="4" stroke-dasharray="8,4" />
  <circle cx="120" cy="120" r="102" fill="none" stroke="#d97706" stroke-width="2" />
  <circle cx="120" cy="120" r="82" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="3,3" />
  
  <path id="sealTop" d="M 35,120 A 85,85 0 0,1 205,120" fill="none" />
  <text font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#92400e" letter-spacing="2">
    <textPath href="#sealTop" startOffset="50%" text-anchor="middle">
      * OFFICIAL ACADEMIC TRANSCRIPT *
    </textPath>
  </text>

  <path id="sealBottom" d="M 205,120 A 85,85 0 0,1 35,120" fill="none" />
  <text font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#92400e" letter-spacing="1.5">
    <textPath href="#sealBottom" startOffset="50%" text-anchor="middle">
      KANO STATE POLYTECHNIC SEAL
    </textPath>
  </text>

  <!-- Center Verification Icon -->
  <circle cx="120" cy="120" r="45" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <path d="M 102,120 L 114,132 L 140,106" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <text x="120" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="1">
    VERIFIED &amp; AUTHENTIC
  </text>
</svg>